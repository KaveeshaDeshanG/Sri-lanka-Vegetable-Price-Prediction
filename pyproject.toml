[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sl-veggie-price-prediction"
version = "1.0.0"
description = "AI-powered Sri Lankan vegetable price prediction system using historical market and weather data."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "joblib>=1.3.0",
    "streamlit>=1.32.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "pymupdf>=1.24.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0", "black>=24.0.0"]

# "src*" and "config*" pick up every subpackage added in later phases
# (src.preprocessing, src.feature_engineering, ...) without editing this
# file again each phase.
[tool.setuptools.packages.find]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
